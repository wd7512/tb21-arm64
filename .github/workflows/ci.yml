name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Run every non-skipped task
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
      - run: uv sync --locked
      - name: Run repository gate
        run: >-
          uv run python -c 'import subprocess, tomllib; command = tomllib.load(open("pyproject.toml", "rb"))["tool"]["devtools"]["delegate"]["gate_command"]; subprocess.run(command, shell=True, check=True)'

  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6.6.1
      - id: matrix
        name: Select tasks
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            uv run python tools/ci_tasks.py --changed "origin/${{ github.base_ref }}" > task-matrix.json
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            uv run python tools/ci_tasks.py --changed "${{ github.event.before }}" > task-matrix.json
          elif [[ "${{ inputs.all }}" == "true" ]]; then
            uv run python tools/ci_tasks.py --all > task-matrix.json
          else
            printf '[]\n' > task-matrix.json
          fi
          echo "tasks=$(cat task-matrix.json)" >> "$GITHUB_OUTPUT"

  task:
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.6.1
      - name: Build and verify task
        run: uv run python tools/sweep.py "${{ matrix.task }}" --out reports/ci
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: task-${{ matrix.task }}
          path: |
            reports/ci/*.json
            reports/ci/*.log
            reports/ci/jobs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish the tested image
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TB21_PUBLISH == 'true'
        env:
          TASK: ${{ matrix.task }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          built="tb21-arm64-local/${TASK}:sweep"
          image_ref=""
          push_failed=0
          if docker image inspect "$built" >/dev/null 2>&1; then
            tag=$(uv run python -c 'import json, os; print(json.load(open("manifest.json"))["tasks"][os.environ["TASK"]]["upstream"]["image"].rsplit(":", 1)[1])')
            image="ghcr.io/wd7512/tb21-arm64/${TASK}:${tag}"
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker tag "$built" "$image"
            if docker push "$image"; then
              if image_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image"); then
                :
              else
                echo "could not inspect published digest for $image"
                push_failed=1
              fi
            else
              echo "failed to publish $image"
              push_failed=1
            fi
          else
            echo "no image built for $TASK (build failed, or the task uses upstream's arm64 image)"
          fi
          uv run python - "$TASK" "$image_ref" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          task, image = sys.argv[1:]
          report = json.loads(Path("reports/ci", f"{task}.sweep.json").read_text())
          publish = {
              "task": task,
              "image": image or None,
              "verdict": report["verdict"],
              "reason": report["reason"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          path = Path("reports/ci", f"{task}.publish.json")
          path.write_text(json.dumps(publish, indent=2) + "\n")
          PY
          exit "$push_failed"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: publish-${{ matrix.task }}
          path: reports/ci/${{ matrix.task }}.publish.json
          if-no-files-found: ignore
          retention-days: 14

  record:
    needs: [plan, task]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.TB21_PUBLISH == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: publish-*
          path: reports/published
          merge-multiple: true
          if-no-artifact-found: ignore
      - uses: astral-sh/setup-uv@v6.6.1
      - name: Record published images and verdicts
        run: uv run python tools/record_ci.py reports/published
      - name: Commit and push records
        run: |
          if git diff --quiet; then
            echo "No CI records changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json */task.toml
          git commit -m "ci: record published images and verdicts (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin main
            fi
          done
          exit 1
